# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Biological Learning and Rehabilitation Group
email: siva82kb@cmcvellore.ac.in
description: > # this means to ignore newlines until "baseurl:"
  The Biological Learning and Rehabilitation (BioRehab) Group at the
  Department of Bioengineering, Christian Medical College Vellore. We develop
  and validate neurorehabilitation tools and methods for assessing and
  training sensorimotor function, working at the interface of engineering,
  neuromechanics, and neurorehabilitation.
baseurl: ""
url: ""

include:
  - .htaccess
  - _pages

# Superseded 2021-era version of the site, kept on disk for reference only.
# It is excluded from the build because arxiv/research.md claims the same
# permalink (/research/) as _pages/research.md, and because the directory
# contains LaTeX build artefacts and editor workspace files.
exclude:
  - arxiv
  - labpage.code-workspace
  - Gemfile
  - Gemfile.lock
  - README.md

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

